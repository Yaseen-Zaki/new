plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fondi.photosync'
    compileSdk 35

    defaultConfig {
        applicationId "com.fondi.photosync"
        minSdk 19
        targetSdk 28
        versionCode 1
        versionName "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        // Fondi Photo Sync is side-loaded onto the Android 4.4 tablet,
        // not distributed through Google Play. Play's targetSdk minimum
        // does not apply. targetSdk 28 is a deliberate compatibility
        // choice pending the Phase 6 platform review.
        disable 'ExpiredTargetSdkVersion'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    // Pinned to the last versions that support minSdk 19 (Android 4.4).
    // AppCompat 1.7.0+ requires minSdk 21 and will not build on the Fondi
    // tablet. Do not bump without checking the new minSdk requirement.
    //noinspection GradleDependency
    implementation 'androidx.appcompat:appcompat:1.6.1'
    //noinspection GradleDependency
    implementation 'androidx.preference:preference:1.2.1'
}
